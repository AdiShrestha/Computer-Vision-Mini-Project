[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-gl"
version = "1.0.0"
description = "Source-bound Sentinel-2 patch time series, a masked spatiotemporal transformer and parameter-free references for two Sikkim glacial lakes (retrospective case study)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Aditya Shrestha" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.0",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
    "torch==2.12.1",
    "rasterio==1.5.1",
    "pyproj==3.7.2",
    "shapely==2.1.2",
    "pyshp==3.1.6",
    "requests==2.34.2",
    "defusedxml==0.7.1",
    "matplotlib==3.11.0",
    "pillow==12.2.0",
    "python-docx==1.2.0",
    "lxml==6.1.3",
    "pytest==9.1.1",
]

[tool.setuptools]
package-dir = { "" = "source" }
packages = ["sentinel_gl", "sentinel_gl.ingestion"]

[tool.setuptools.package-data]
sentinel_gl = ["schemas/*.json"]
